      const [isTyping, setIsTyping] = useState(false);
      const [streamingCharCount, setStreamingCharCount] = useState(0);
      const [typingStatus, setTypingStatus] = useState('Thinking...');
      const [showChips, setShowChips] = useState(true);
      const [apiError, setApiError] = useState('');
      const messagesEndRef = useRef(null);
      const inputRef = useRef(null);
      const msgIdRef = useRef(2);

      useEffect(() => {
        if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isTyping, streamingCharCount]);

      const handleClose = () => {
        setIsAnimatingOut(true);
        setShowSettings(false);
        setTimeout(() => { setIsOpen(false); setIsAnimatingOut(false); }, 240);
      };

      const handleKeyConnected = (key) => {
        setApiKey(key);
        setShowSettings(false);
        setApiError('');
        const welcomeMsg = {
          id: msgIdRef.current++, role: 'bot',
          text: `✅ **Custom Gemini AI Key Connected!**\n\nNOVA is now using your personal Gemini API key directly for all requests.`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setMessages(prev => [...prev, welcomeMsg]);
        setShowChips(true);
      };

      const handleDisconnect = () => {
        localStorage.setItem('nova_gemini_key', 'AIzaSyAntigravityNovaDemoKey');
        setApiKey('AIzaSyAntigravityNovaDemoKey');
        setConversationHistory([]);
        setMessages([{ id: msgIdRef.current++, role: 'bot', text: '🔌 Custom API key removed. Using ANTIGRAVITY Backend LLM Server.', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]);
        setShowSettings(false);
        setShowChips(true);
      };

      const copyToClipboard = (id, text) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => {
            setCopiedId(id);
            setTimeout(() => setCopiedId(null), 2000);
          }).catch(() => {});
        }
      };

      const sendMessage = async (textOverride) => {
        const trimmed = (textOverride || inputVal).trim();
        if (!trimmed || isTyping) return;
        setInputVal('');
        setShowChips(false);
        setApiError('');
        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const userMsg = { id: msgIdRef.current++, role: 'user', text: trimmed, time: now };
        setMessages(prev => [...prev, userMsg]);
        setIsTyping(true);
        setStreamingCharCount(0);

        const updatedHistory = trimHistory([...conversationHistory, { role: 'user', text: trimmed }]);
        const botMsgId = msgIdRef.current++;
        let isStreamSuccess = false;

        try {
          if (apiKey && apiKey !== 'AIzaSyAntigravityNovaDemoKey') {
            // Direct User API Key Path
            const resData = await callGeminiAPI(apiKey, conversationHistory, trimmed, coins);
            const isTruncated = resData.finishReason === 'MAX_TOKENS';
            const botMsg = { id: botMsgId, role: 'bot', text: resData.text, isTruncated, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
            setMessages(prev => [...prev, botMsg]);
            const newHist = trimHistory([...updatedHistory, { role: 'model', text: resData.text }]);
            setConversationHistory(newHist);
          } else {
            // Default Streaming Path via POST http://localhost:5000/api/chat/stream
            try {
              const res = await fetch('http://localhost:5000/api/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  message: trimmed,
                  conversationHistory: updatedHistory.slice(0, -1),
                  coins,
                  model: selectedModel
                })
              });

              if (res.ok && res.body) {
                isStreamSuccess = true;
                let accumulatedText = '';
                let finishReason = 'STOP';

                const botMsgPlaceholder = { id: botMsgId, role: 'bot', text: '', isStreaming: true, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
                setMessages(prev => [...prev, botMsgPlaceholder]);

                const reader = res.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';

                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  buffer += decoder.decode(value, { stream: true });
                  const lines = buffer.split('\n\n');
                  buffer = lines.pop();

                  for (const line of lines) {
                    const trimmedLine = line.trim();
                    if (trimmedLine.startsWith('data: ')) {
                      try {
                        const dataObj = JSON.parse(trimmedLine.slice(6));
                        if (dataObj.chunk) {
                          accumulatedText += dataObj.chunk;
                          setStreamingCharCount(accumulatedText.length);
                          setMessages(prev => prev.map(m => m.id === botMsgId ? { ...m, text: accumulatedText } : m));
                        }
                        if (dataObj.done) {
                          finishReason = dataObj.finishReason || 'STOP';
                        }
                        if (dataObj.error) {
                          throw new Error(dataObj.error);
                        }
                      } catch (e) {
                        if (e.message && (e.message.includes('Quota') || e.message.includes('429'))) throw e;
                      }
                    }
                  }
                }

                const isTruncated = finishReason === 'MAX_TOKENS';
                setMessages(prev => prev.map(m => m.id === botMsgId ? { ...m, isStreaming: false, isTruncated } : m));
                const newHist = trimHistory([...updatedHistory, { role: 'model', text: accumulatedText }]);
                setConversationHistory(newHist);
              }
            } catch (streamErr) {
              console.warn("Streaming SSE failed, trying standard POST /api/chat:", streamErr);
            }

            if (!isStreamSuccess) {
              const res = await fetch('http://localhost:5000/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  message: trimmed,
                  conversationHistory: updatedHistory.slice(0, -1),
                  coins,
                  model: selectedModel
                })
              });

              const data = await res.json();
              if (res.ok && data.reply) {
                const isTruncated = data.finishReason === 'MAX_TOKENS';
                const botMsg = { id: botMsgId, role: 'bot', text: data.reply, isTruncated, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
                setMessages(prev => [...prev, botMsg]);
                const newHist = trimHistory([...updatedHistory, { role: 'model', text: data.reply }]);
                setConversationHistory(newHist);
              } else {
                throw new Error(data.error || "Can't reach the AI backend right now — is bot_server.py running?");
              }
            }
          }
        } catch (err) {
          const errText = err.message || '';
          let userFriendly = '';
          if (errText.startsWith('⏳') || errText.startsWith('❌') || errText.startsWith('⚠️')) {
            userFriendly = errText;
          } else if (errText === 'INVALID_KEY') {
            userFriendly = `❌ **Invalid API Key**\n\nYour Gemini API key was rejected. Please check your key in ⚙️ settings.`;
          } else if (errText.includes('Failed to fetch') || errText.includes('bot_server.py') || errText.includes('Backend') || errText.includes('offline')) {
            userFriendly = `⚠️ **AI Backend Offline**\n\nCan't reach the AI backend right now — make sure \`python bot_server.py\` is running, or add your own free Gemini key in settings (⚙️).`;
          } else if (errText.includes('429') || errText.includes('quota') || errText.includes('RESOURCE_EXHAUSTED')) {
            userFriendly = `⏳ **Gemini API Quota Exceeded (HTTP 429)**\n\nYour API key has hit the free tier rate limit or has 0 quota.\n\n**Quick Fix:**\n1. Generate a free key at [aistudio.google.com/app/apikey](https://aistudio.google.com/app/apikey)\n2. Click ⚙️ in NOVA chat settings and connect your key.`;
          } else {
            userFriendly = `⚠️ **Error:** ${errText}`;
          }
          const errMsg = { id: msgIdRef.current++, role: 'bot', text: userFriendly, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
          setMessages(prev => [...prev, errMsg]);
          setConversationHistory(updatedHistory.slice(0, -1));
        } finally {
          setIsTyping(false);
          setStreamingCharCount(0);
        }
      };

      const handleContinue = async (msgId) => {
        const targetMsg = messages.find(m => m.id === msgId);
        if (!targetMsg || isTyping) return;
        setIsTyping(true);

        const continuePrompt = `Continue your previous response exactly where you left off. Do not repeat what you already wrote. Previous ending context: "...${targetMsg.text.slice(-120)}"`;
        const updatedHistory = trimHistory([...conversationHistory, { role: 'user', text: continuePrompt }]);

        try {
          const res = await fetch('http://localhost:5000/api/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: continuePrompt,
              conversationHistory: updatedHistory.slice(0, -1),
              coins,
              model: selectedModel
            })
          });

          if (res.ok && res.body) {
            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let finishReason = 'STOP';
            let addedText = '';

            setMessages(prev => prev.map(m => m.id === msgId ? { ...m, isStreaming: true, isTruncated: false } : m));

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split('\n\n');
              buffer = lines.pop();

              for (const line of lines) {
                const trimmedLine = line.trim();
                if (trimmedLine.startsWith('data: ')) {
                  try {
                    const dataObj = JSON.parse(trimmedLine.slice(6));
                    if (dataObj.chunk) {
                      addedText += dataObj.chunk;
                      setMessages(prev => prev.map(m => m.id === msgId ? { ...m, text: targetMsg.text + addedText } : m));
                    }
                    if (dataObj.done) finishReason = dataObj.finishReason || 'STOP';
                  } catch (e) {}
                }
              }
            }

            const isTruncated = finishReason === 'MAX_TOKENS';
            const fullText = targetMsg.text + addedText;
            setMessages(prev => prev.map(m => m.id === msgId ? { ...m, isStreaming: false, isTruncated } : m));
            setConversationHistory(prev => trimHistory([...prev, { role: 'model', text: fullText }]));
          }
        } catch (e) {
          console.error("Continue failed:", e);
        } finally {
          setIsTyping(false);
        }
      };

      const handleRegenerate = () => {
        const lastUserMsg = [...messages].reverse().find(m => m.role === 'user');
        if (lastUserMsg && !isTyping) {
          setMessages(prev => {
            const lastIdx = prev.map(m => m.role).lastIndexOf('bot');
            if (lastIdx !== -1) return prev.slice(0, lastIdx);
            return prev;
          });
          sendMessage(lastUserMsg.text);
        }
      };

      const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
      const handleChip = (chip) => { sendMessage(CHIP_QUERIES[chip] || chip); };
      const handleClear = () => {
        setMessages([{ id: msgIdRef.current++, role: 'bot', text: `🔄 Conversation cleared! How can I help you next?`, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]);
        setConversationHistory([]);
        setShowChips(true);
      };

      const isConnected = !!apiKey;
      const lastBotMsgId = [...messages].reverse().find(m => m.role === 'bot')?.id;

      return (
        <>
          {/* FAB */}
          {!isOpen && (
            <button className="ai-fab" onClick={() => setIsOpen(true)} title="Open NOVA AI Assistant" id="ai-assistant-fab">
              <span className="ai-fab-badge"></span>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
              </svg>
            </button>
          )}

          {/* PANEL */}
          {(isOpen || isAnimatingOut) && (
            <div className={"ai-panel " + (isAnimatingOut ? 'close' : 'open')} id="ai-assistant-panel">

              {/* Header */}
              <div className="ai-header">
                <div className="ai-avatar">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="3" /><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83" />
                  </svg>
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                    <span style={{ fontWeight: 700, color: '#e2e8f0', fontSize: '0.9rem', letterSpacing: '-0.01em' }}>NOVA AI</span>
                    <select
                      value={selectedModel}
                      onChange={e => setSelectedModel(e.target.value)}
                      title="Select AI Model"
                      style={{ background: 'rgba(99,102,241,0.15)', border: '1px solid rgba(99,102,241,0.3)', borderRadius: '0.375rem', color: '#a5b4fc', fontSize: '10px', fontWeight: 600, padding: '1px 4px', cursor: 'pointer', outline: 'none' }}
                    >
                      <option value="gemini-2.0-flash" style={{ background: '#0b0b14', color: '#e2e8f0' }}>⚡ Gemini 2.0 Flash</option>
                      <option value="gemini-flash-latest" style={{ background: '#0b0b14', color: '#e2e8f0' }}>🚀 Gemini Flash Latest</option>
                      <option value="gemini-1.5-pro" style={{ background: '#0b0b14', color: '#e2e8f0' }}>🧠 Gemini 1.5 Pro</option>
                    </select>
                  </div>
                  <div style={{ fontSize: '10px', fontWeight: 600, display: 'flex', alignItems: 'center', gap: '0.3rem', color: isConnected ? '#6366f1' : '#f59e0b' }}>
                    <span style={{ width: '6px', height: '6px', background: isConnected ? '#22c55e' : '#f59e0b', borderRadius: '9999px', display: 'inline-block' }}></span>
                    {apiKey === 'AIzaSyAntigravityNovaDemoKey'
                      ? 'NOVA Streaming LLM Active'
                      : isConnected
                        ? 'Gemini Custom Key'
                        : 'No AI Key — Click ⚙️ to connect'}
                  </div>
                </div>
                <div style={{ display: 'flex', gap: '0.375rem' }}>
                  <button onClick={() => setShowSettings(s => !s)} title={isConnected ? "API Settings" : "Connect AI"} style={{ background: showSettings ? 'rgba(99,102,241,0.2)' : 'rgba(99,102,241,0.1)', border: '1px solid rgba(99,102,241,0.2)', borderRadius: '0.5rem', color: '#818cf8', cursor: 'pointer', width: '1.875rem', height: '1.875rem', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Icons.Settings size={13} />
                  </button>
                  <button onClick={handleClear} title="Clear conversation" style={{ background: 'rgba(99,102,241,0.1)', border: '1px solid rgba(99,102,241,0.2)', borderRadius: '0.5rem', color: '#818cf8', cursor: 'pointer', width: '1.875rem', height: '1.875rem', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Icons.RotateCcw size={13} />
                  </button>
                  <button onClick={handleClose} title="Close" style={{ background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.2)', borderRadius: '0.5rem', color: '#f87171', cursor: 'pointer', width: '1.875rem', height: '1.875rem', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Icons.X size={13} />
                  </button>
                </div>
              </div>

              {/* Settings Panel */}
              {showSettings && (
                <div style={{ borderBottom: '1px solid rgba(99,102,241,0.12)', background: 'rgba(10,10,20,0.95)', padding: '1rem', flexShrink: 0 }}>
                  {isConnected && apiKey !== 'AIzaSyAntigravityNovaDemoKey' ? (
                    <div>
                      <div style={{ fontSize: '0.75rem', fontWeight: 700, color: '#e2e8f0', marginBottom: '0.5rem' }}>✅ Gemini AI Connected</div>
                      <div style={{ fontSize: '0.7rem', color: '#6b7280', fontFamily: 'monospace', background: 'rgba(20,20,35,0.8)', padding: '0.375rem 0.625rem', borderRadius: '0.375rem', marginBottom: '0.625rem', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                        {apiKey.substring(0, 12)}{'•'.repeat(Math.max(0, apiKey.length - 16))}{apiKey.slice(-4)}
                      </div>
                      <div style={{ display: 'flex', gap: '0.5rem' }}>
                        <button onClick={handleDisconnect} style={{ flex: 1, padding: '0.375rem', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.25)', borderRadius: '0.5rem', color: '#f87171', fontSize: '0.7rem', fontWeight: 700, cursor: 'pointer' }}>
                          🔌 Disconnect
                        </button>
                        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" style={{ flex: 1, padding: '0.375rem', background: 'rgba(99,102,241,0.1)', border: '1px solid rgba(99,102,241,0.25)', borderRadius: '0.5rem', color: '#a5b4fc', fontSize: '0.7rem', fontWeight: 700, cursor: 'pointer', textAlign: 'center', textDecoration: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                          🔑 AI Studio
                        </a>
                      </div>
                    </div>
                  ) : (
                    <APIKeySetup onSave={handleKeyConnected} />
                  )}
                </div>
              )}

              {/* Messages */}
              {!showSettings && (
                <>
                  <div className="ai-messages">
                    {messages.map(msg => (
                      <div key={msg.id} className={"ai-msg " + msg.role}>
                        {msg.role === 'bot' && (
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '0.25rem', width: '100%' }}>
                            <div style={{ display: 'flex', alignItems: 'flex-start', gap: '0.4rem' }}>
                              <div style={{ width: '1.5rem', height: '1.5rem', borderRadius: '9999px', background: 'linear-gradient(135deg, #6366f1, #8b5cf6)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: '2px' }}>
                                <svg width="9" height="9" viewBox="0 0 24 24" fill="white" stroke="none"><circle cx="12" cy="12" r="10" /></svg>
                              </div>
                              <div style={{ flex: 1 }}>
                                <div className="ai-bubble" dangerouslySetInnerHTML={{ __html: formatMsgText(msg.text) }} />
                                
                                {/* Action Bar: Copy & Regenerate */}
                                {!msg.isStreaming && msg.text && (
                                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginTop: '0.375rem', fontSize: '11px' }}>
                                    <button
                                      onClick={() => copyToClipboard(msg.id, msg.text)}
                                      title="Copy to clipboard"
                                      style={{ background: 'rgba(255,255,255,0.04)', border: 'none', color: '#94a3b8', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.25rem', padding: '2px 6px', borderRadius: '4px' }}
                                    >
                                      {copiedId === msg.id ? '✓ Copied' : '📋 Copy'}
                                    </button>
                                    {msg.id === lastBotMsgId && !isTyping && (
                                      <button
                                        onClick={handleRegenerate}
                                        title="Regenerate response"
                                        style={{ background: 'rgba(99,102,241,0.08)', border: 'none', color: '#818cf8', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.25rem', padding: '2px 6px', borderRadius: '4px' }}
                                      >
                                        🔄 Regenerate
                                      </button>
                                    )}
                                  </div>
                                )}

                                {/* Truncated "Click to Continue" Button */}
                                {msg.isTruncated && !isTyping && (
                                  <button
                                    onClick={() => handleContinue(msg.id)}
                                    style={{ marginTop: '0.5rem', padding: '0.375rem 0.75rem', background: 'linear-gradient(135deg, rgba(245,158,11,0.15), rgba(217,119,6,0.25))', border: '1px solid rgba(245,158,11,0.4)', borderRadius: '0.5rem', color: '#fbbf24', fontSize: '0.75rem', fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.375rem' }}
                                  >
                                    ▶ Response Truncated — Click to Continue
                                  </button>
                                )}
                              </div>
                            </div>
                          </div>
                        )}
                        {msg.role === 'user' && <div className="ai-bubble" dangerouslySetInnerHTML={{ __html: formatMsgText(msg.text) }} />}
                        <div className="ai-msg-time">
                          {msg.time} {msg.isStreaming && streamingCharCount > 0 ? `• ${streamingCharCount} chars` : ''}
                        </div>
                      </div>
                    ))}
                    {isTyping && !messages.some(m => m.isStreaming) && (
                      <div className="ai-msg bot">
                        <div style={{ display: 'flex', alignItems: 'flex-end', gap: '0.4rem' }}>
                          <div style={{ width: '1.5rem', height: '1.5rem', borderRadius: '9999px', background: 'linear-gradient(135deg, #6366f1, #8b5cf6)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                            <svg width="9" height="9" viewBox="0 0 24 24" fill="white" stroke="none"><circle cx="12" cy="12" r="10" /></svg>
                          </div>
                          <div className="ai-typing-bubble">
                            <div className="ai-typing-dot"></div>
                            <div className="ai-typing-dot"></div>
                            <div className="ai-typing-dot"></div>
                          </div>
                        </div>
                        <div className="ai-msg-time">{typingStatus}</div>
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>

                  {/* Quick Chips */}
                  {showChips && isConnected && (
                    <div className="ai-quick-chips">
                      {QUICK_CHIPS.map(chip => (
                        <button key={chip} className="ai-chip" onClick={() => handleChip(chip)} disabled={isTyping}>{chip}</button>
                      ))}
                    </div>
                  )}
                  {!showChips && isConnected && (
                    <div style={{ padding: '0.375rem 1rem', borderTop: '1px solid rgba(99,102,241,0.08)', display: 'flex', gap: '0.375rem', overflowX: 'auto', flexShrink: 0 }}>
                      {['₿ BTC', '⧫ ETH', '🌊 SOL', '📈 Market', '😱 Fear & Greed'].map(chip => (
                        <button key={chip} className="ai-chip" style={{ flexShrink: 0 }} onClick={() => handleChip(CHIP_QUERIES[chip] || `Analyze ${chip.replace(/[^a-zA-Z ]/g, '').trim()}`)} disabled={isTyping}>{chip}</button>
                      ))}
                    </div>
                  )}
                  {!isConnected && !showSettings && (
                    <div style={{ padding: '0.75rem 1rem', borderTop: '1px solid rgba(99,102,241,0.1)', flexShrink: 0 }}>
                      <button onClick={() => setShowSettings(true)} style={{ width: '100%', padding: '0.625rem', background: 'linear-gradient(135deg, #6366f1, #7c3aed)', border: 'none', borderRadius: '0.75rem', color: '#fff', fontSize: '0.8rem', fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.375rem' }}>
                        <Icons.Key size={14} /> Connect Free Gemini AI Key
                      </button>
                    </div>
                  )}

                  {/* Input */}
                  <div className="ai-input-row">
                    <textarea
                      ref={inputRef}
                      className="ai-input"
                      rows={1}
                      value={inputVal}
                      onChange={e => setInputVal(e.target.value)}
                      onKeyDown={handleKeyDown}
                      placeholder={isConnected ? "Ask about any coin, market, or strategy..." : "Connect Gemini AI key to start chatting..."}
                      disabled={isTyping}
                      style={{ lineHeight: '1.4', maxHeight: '80px', overflowY: 'auto' }}
                    />
                    <button className="ai-send-btn" onClick={() => sendMessage()} disabled={isTyping || !inputVal.trim()} title="Send">
                      <Icons.Send size={15} />
                    </button>
                  </div>
                </>
              )}
            </div>
          )}
        </>
      );
    }

    // =====================================================
    // RENDER
    // =====================================================
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
